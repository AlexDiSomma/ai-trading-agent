# ============================================================
#  Infrastruttura locale.
#
#  ATTENZIONE: il connettore MetaTrader 5 NON gira in questi
#  container. Il pacchetto MetaTrader5 esiste solo su Windows e
#  richiede il terminale grafico in esecuzione: gira quindi come
#  processo separato sull'host Windows (mt5-gateway).
#  Motivo e conseguenze: docs/adr/0003-mt5-gateway-windows.md
# ============================================================
name: ai-trading-agent

services:
  postgres:
    image: postgres:16-alpine
    container_name: ata-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-trading_agent}
      POSTGRES_USER: ${DB_USER:-trading}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cambiami}
      # Il giorno di trading si chiude sull'ora del broker, non su quella locale:
      # il database resta in UTC e la conversione e' esplicita nel codice.
      TZ: UTC
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-trading} -d ${DB_NAME:-trading_agent}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ata-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # API: solo lettura dei contesti e orchestrazione. Nessuna logica di
  # trading nel ciclo di richiesta (vedi ADR 0002).
  api:
    build:
      context: .
      dockerfile: infra/backend/Dockerfile
    container_name: ata-api
    restart: unless-stopped
    command: ["uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: [.env]
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      # Dentro il container non c'e' MT5: si usa il terminale finto.
      MT5_USE_MOCK: "true"
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx;httpx.get('http://localhost:8000/api/health').raise_for_status()"]
      interval: 20s
      timeout: 5s
      retries: 3
    profiles: ["full"]

volumes:
  postgres_data:
  redis_data:
