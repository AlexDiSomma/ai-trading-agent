[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-trading-agent"
version = "0.1.0"
description = "Piattaforma di algorithmic trading AI-assisted su MetaTrader 5 (broker XM)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }

dependencies = [
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # Configurazione e validazione
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # Persistenza
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "greenlet>=3.1",
    # Cache / code
    "redis>=5.2",
    # Calcolo quantitativo
    "pandas>=2.2",
    "numpy>=2.1",
    "scipy>=1.14",
    "scikit-learn>=1.5",
    # HTTP verso provider esterni
    "httpx>=0.28",
    # Fusi orari: Windows non ha il database IANA (CBOE e Tesoro USA datano in
    # ora di New York, Forex Factory pubblica con offset). Fase 4.5.
    "tzdata>=2024.1",
    # Lettura sicura dei feed RSS di notizie (XML da Internet): niente entità esterne
    # né espansioni maliziose. Notizie, 2026-10-06.
    "defusedxml>=0.7",
    # Logging strutturato
    "structlog>=24.4",
    "orjson>=3.10",
]

[project.optional-dependencies]
# MetaTrader5 esiste solo su Windows: l'extra evita di rompere le immagini Linux.
mt5 = ["MetaTrader5>=5.0.45; sys_platform == 'win32'"]
ai = ["anthropic>=0.40", "openai>=1.57"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "freezegun>=1.5",
]

[project.scripts]
trading-api = "backend.main:run"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

# ------------------------------------------------------------------
# Test
# ------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "unit: test isolati, nessuna risorsa esterna",
    "integration: richiedono API/DB in-process (nessun broker reale)",
    "live_broker: richiedono MT5 reale, esclusi di default",
]
filterwarnings = ["error::DeprecationWarning:backend.*"]

# ------------------------------------------------------------------
# Lint / formato
# ------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["backend/database/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "ASYNC", "S"]
ignore = [
    "A003",    # attributi che "ombreggiano" builtin nei modelli: accettabile
    "S101",    # assert nei test
    "RUF001",  # caratteri unicode nelle stringhe italiane
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.flake8-bugbear]
# In FastAPI i parametri si dichiarano con Query/Body/Depends nei default: e' il
# modo previsto dal framework, non l'antipattern che B008 intercetta.
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Depends",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
]

[tool.ruff.lint.per-file-ignores]
"backend/tests/*" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_ignores = true
disallow_untyped_decorators = false
ignore_missing_imports = true
exclude = "backend/database/migrations"
